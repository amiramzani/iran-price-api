name: Update Prices
 
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Fetch & parse prices
        run: |
          python3 - << 'PYEOF'
          import json, os, urllib.request, urllib.error
          from datetime import datetime
 
          SOURCES = [
              {
                  "url": "https://call.tgju.org/ajax.json",
                  "headers": {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                      "Accept": "application/json, text/javascript, */*; q=0.01",
                      "Accept-Language": "fa-IR,fa;q=0.9,en-US;q=0.8",
                      "Referer": "https://www.tgju.org/",
                      "Origin": "https://www.tgju.org",
                      "X-Requested-With": "XMLHttpRequest",
                  }
              },
              {
                  "url": "https://call2.tgju.org/ajax.json",
                  "headers": {
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36",
                      "Referer": "https://www.tgju.org/",
                  }
              },
          ]
 
          MAP = {
              "USD":     ("price_dollar_rl", True),
              "EUR":     ("price_euro",      True),
              "AED":     ("price_aed",       True),
              "GBP":     ("price_gbp",       True),
              "TRY":     ("price_try",       True),
              "GOLD18":  ("geram18",         False),
              "GOLD24":  ("geram24",         False),
              "OZ":      ("ons",             False),
              "EMAMI":   ("sekee",           False),
              "HALF":    ("nim",             False),
              "QUARTER": ("rob",             False),
              "GRAM":    ("seke_gerami",     False),
          }
 
          def pn(val):
              try: return float(str(val).replace(",", ""))
              except: return 0
 
          def fetch_source(src):
              req = urllib.request.Request(src["url"], headers=src["headers"])
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode("utf-8"))
 
          raw = None
          for src in SOURCES:
              try:
                  raw = fetch_source(src)
                  print(f"✅ fetched from {src['url']}")
                  break
              except Exception as e:
                  print(f"❌ {src['url']}: {e}")
 
          if not raw:
              raise Exception("All sources failed")
 
          current = raw.get("current", {})
          out = {}
          for sym, (key, is_currency) in MAP.items():
              row = current.get(key, {})
              price  = pn(row.get("p",  0))
              change = pn(row.get("d",  0))
              pct    = pn(row.get("dp", 0))
              if is_currency:
                  price  = round(price  / 10)
                  change = round(change / 10)
              if price > 0:
                  out[sym] = {"price": price, "change": change, "pct": round(pct, 2),
                              "ts": datetime.utcnow().isoformat() + "Z"}
 
          result = {"ok": len(out) >= 5, "updated": datetime.utcnow().isoformat() + "Z", "data": out}
          os.makedirs("data", exist_ok=True)
          with open("data/prices.json", "w") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(f"✅ {len(out)} symbols written → ok={result['ok']}")
          PYEOF
 
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "prices: $(date -u '+%H:%M UTC')"
          git push
