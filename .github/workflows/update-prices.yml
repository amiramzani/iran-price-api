name: Update Prices

on:
  schedule:
    - cron: '*/10 * * * *'   # هر ۱۰ دقیقه
  workflow_dispatch:           # اجرای دستی هم ممکن باشه

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch prices from TGJU
        run: |
          curl -s \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://www.tgju.org/" \
            -H "Accept: application/json" \
            "https://call.tgju.org/ajax.json" \
            -o raw.json

          python3 - << 'PYEOF'
          import json, math, os
          from datetime import datetime

          with open("raw.json") as f:
              raw = json.load(f)

          current = raw.get("current", {})

          def p(val):
              if not val:
                  return 0
              try:
                  return float(str(val).replace(",", ""))
              except:
                  return 0

          def toman(x):
              return round(x / 10)

          MAP = {
              "USD":     ("price_dollar_rl", True),
              "EUR":     ("price_euro",      True),
              "AED":     ("price_aed",       True),
              "GBP":     ("price_gbp",       True),
              "TRY":     ("price_try",       True),
              "GOLD18":  ("geram18",         False),
              "GOLD24":  ("geram24",         False),
              "OZ":      ("ons",             False),
              "EMAMI":   ("sekee",           False),
              "HALF":    ("nim",             False),
              "QUARTER": ("rob",             False),
              "GRAM":    ("seke_gerami",     False),
          }

          out = {}
          for sym, (key, is_currency) in MAP.items():
              row = current.get(key, {})
              price  = p(row.get("p",  0))
              change = p(row.get("d",  0))
              pct    = p(row.get("dp", 0))
              if is_currency:
                  price  = toman(price)
                  change = toman(change)
              if price > 0:
                  out[sym] = {
                      "price":  price,
                      "change": change,
                      "pct":    round(pct, 2),
                      "ts":     datetime.utcnow().isoformat() + "Z"
                  }

          result = {
              "ok":      len(out) >= 5,
              "updated": datetime.utcnow().isoformat() + "Z",
              "data":    out
          }

          os.makedirs("data", exist_ok=True)
          with open("data/prices.json", "w") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"✅ {len(out)} symbols written")
          PYEOF

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "prices: $(date -u '+%H:%M UTC')"
          git push
